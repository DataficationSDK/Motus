name: Motus CI

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "samples/**"
      - "Motus.sln"
      - ".github/workflows/motus-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "samples/**"
      - "Motus.sln"
      - ".github/workflows/motus-ci.yml"

env:
  # The browser every leg tests against. Raise it deliberately, the way a dependency is raised, so a
  # browser change and a code change are never the same red build.
  CHROME_VERSION: 149.0.7827.156

jobs:
  dotnet:
    name: .NET (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # A backstop above the step timeouts below. Without it a stalled run holds a runner for the
    # six-hour default, and the log of a job that never ends cannot be read until it does.
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        # macOS is pinned rather than following the latest label. The browser suite ran green on
        # macos-15 in 47 seconds and has not finished since the label rolled to macOS 26, with no
        # change on our side in between. Pinning keeps the leg meaningful while what the newer
        # image does differently is worked out; it is the same free runner either way.
        os: [ubuntu-latest, windows-latest, macos-15]

    steps:
      - uses: actions/checkout@v4

      # Recorded on every run because the runners differ in ways that decide whether a browser
      # test passes: core count, memory, and the browser build shipped in the image.
      - name: Runner facts
        shell: bash
        run: |
          echo "runner: $RUNNER_NAME ($RUNNER_OS/$RUNNER_ARCH)"
          echo "image:  ${ImageOS:-n/a} ${ImageVersion:-n/a}"
          echo "system: $(uname -srm)"
          case "$RUNNER_OS" in
            macOS)
              echo "cores:  $(sysctl -n hw.ncpu)"
              echo "memory: $(( $(sysctl -n hw.memsize) / 1024 / 1024 )) MB"
              "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --version || true
              ;;
            Linux)
              echo "cores:  $(nproc)"
              echo "memory: $(free -m | awk '/^Mem:/ {print $2}') MB"
              google-chrome --version || true
              ;;
            Windows)
              echo "cores:  ${NUMBER_OF_PROCESSORS:-n/a}"
              powershell -Command "(Get-Item 'C:\Program Files\Google\Chrome\Application\chrome.exe').VersionInfo.ProductVersion" || true
              ;;
          esac
          df -h .

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Motus.sln

      - name: Build
        run: dotnet build Motus.sln --configuration Release --no-restore

      # The browser is pinned rather than taken from whatever the runner image happens to ship. An
      # image update swapped Chrome 149 for 150 under this suite and the macOS leg stopped finishing,
      # with nothing changed on our side: a suite that cannot say which browser it ran against cannot
      # tell that apart from a regression of its own. Every leg uses the same build from here on.
      - name: Install pinned browser
        timeout-minutes: 10
        shell: bash
        run: |
          dotnet run --project src/Motus.Cli/Motus.Cli.csproj --configuration Release --framework net8.0 --no-build -- \
            install --channel chromium --revision "$CHROME_VERSION"

          exe="$(cat "$HOME/.motus/browsers/.installed.chromium")"
          echo "MOTUS_EXECUTABLE_PATH=$exe" >> "$GITHUB_ENV"

          # Ubuntu 24.04 refuses unprivileged user namespaces to programs that have no AppArmor
          # profile of their own, and a browser downloaded rather than installed by the distribution
          # has none. Chrome's sandbox is built on those namespaces, so without this it starts and
          # then goes nowhere. The check below says plainly whether that was the whole story.
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          fi

          # A browser that cannot be driven says so here, in a line or two of its own words, rather
          # than thirty seconds into the first test that tries to drive it. The version is not asked
          # for separately: the installer above already printed it, and asking a browser its version
          # is not the same question on every platform. On Windows chrome.exe has no console to
          # answer on and opens a window instead of exiting, which hangs the step rather than
          # failing it. Driving it is the question that matters, and the answer is the same
          # everywhere.
          smoke_log="${RUNNER_TEMP:-/tmp}/chrome-smoke.log"
          "$exe" --headless=new --remote-debugging-port=9333 \
            --user-data-dir="${RUNNER_TEMP:-/tmp}/chrome-smoke-profile" \
            < /dev/null > "$smoke_log" 2>&1 &
          smoke=$!

          ready=0
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:9333/json/version > /dev/null; then ready=1; break; fi
            sleep 1
          done

          # The whole tree goes, not just the process bash knows about. A browser leaves children
          # behind, and one still holding the debugging port would meet the first test that tries
          # to open its own.
          case "$RUNNER_OS" in
            Windows) taskkill //F //IM chrome.exe //T > /dev/null 2>&1 || true ;;
            *) kill $smoke 2>/dev/null || true ;;
          esac

          if [ "$ready" -ne 1 ]; then
            echo "The pinned browser never accepted a debugging connection. It wrote:"
            cat "$smoke_log"
            exit 1
          fi

          echo "The pinned browser starts and accepts a debugging connection."

      # Coverage is collected only where it is read. The report below is built from the Linux run
      # alone, so instrumenting the other two spends their time and memory producing a file nothing
      # opens, and macOS is the runner with the least of both to spare.
      - name: Test (unit)
        timeout-minutes: 15
        shell: bash
        run: |
          coverage=()
          if [ "$RUNNER_OS" = "Linux" ]; then
            coverage=(--collect:"XPlat Code Coverage" --settings coverage.runsettings)
          fi

          dotnet test Motus.sln \
            --configuration Release \
            --no-build \
            --filter "TestCategory!=Integration&FullyQualifiedName!~Motus.Samples" \
            --logger "trx;LogFilePrefix=results" \
            --results-directory TestResults \
            --blame-hang --blame-hang-timeout 5m --blame-hang-dump-type mini \
            "${coverage[@]}"

      # The sample suite drives a real browser, so it runs on its own rather than inside the unit
      # step. A browser that stalls or dies is then reported as itself, with its own bound, instead
      # of stopping the run that covers everything else.
      #
      # Output goes to a file rather than straight to the log. A browser launched by the tests
      # inherits this step's stdout and stderr, and if it outlives the run the runner waits on
      # those pipes for output that will never come: the step timeout below then has nothing to
      # cancel and the job hangs until the six-hour ceiling. Writing to a file leaves the runner
      # holding nothing, and the file survives a killed step for the artifact to carry out.
      - name: Test (browser samples)
        timeout-minutes: 12
        shell: bash
        run: |
          mkdir -p TestResults

          coverage=()
          if [ "$RUNNER_OS" = "Linux" ]; then
            coverage=(--collect:"XPlat Code Coverage" --settings coverage.runsettings)
          fi

          dotnet test samples/Motus.Samples/Motus.Samples.csproj \
            --configuration Release \
            --no-build \
            --filter "TestCategory!=Integration" \
            --logger "trx;LogFilePrefix=samples" \
            --results-directory TestResults \
            --blame-hang --blame-hang-timeout 3m --blame-hang-dump-type mini \
            "${coverage[@]}" \
            < /dev/null > TestResults/samples-console.log 2>&1 &
          tests=$!

          # The step timeout above has twice failed to end this step, so the run is bounded from
          # inside it as well. A step that ends here leaves its console log and a picture of the
          # machine behind; a job the runner never manages to cancel leaves nothing at all. The
          # watchdog holds no streams of its own, so being orphaned cannot keep the step open.
          ( sleep 540; kill -9 $tests 2>/dev/null ) < /dev/null > /dev/null 2>&1 &
          watchdog=$!
          disown $watchdog 2>/dev/null || true

          status=0
          wait $tests || status=$?
          kill $watchdog 2>/dev/null || true

          cat TestResults/samples-console.log

          # What the machine had left is the question a hang here raises, and it cannot be asked
          # after the fact.
          if [ $status -ne 0 ]; then
            echo "--- the machine, once the run ended ---"
            case "$RUNNER_OS" in
              macOS)
                vm_stat
                ps -Ao pid,ppid,%cpu,%mem,rss,comm | sort -k5 -rn | head -12
                ;;
              Linux)
                free -m
                ps -eo pid,ppid,%cpu,%mem,rss,comm --sort=-rss | head -12
                ;;
            esac
          fi

          exit $status

      # A browser that outlived the run is what wedges the next step, so it goes now rather than
      # at the end of the job.
      - name: Stop stray browsers
        if: always()
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Windows) taskkill //F //IM chrome.exe //T 2>/dev/null || true ;;
            *) pkill -f "\.motus/browsers" || true
               pkill -f "remote-debugging-port" || true ;;
          esac
          exit 0

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          # The sequence file and the dump are what a hang leaves behind: the first names the test
          # that was running when everything stopped, the second says where it was.
          path: |
            TestResults/**/*.trx
            TestResults/**/*Sequence.xml
            TestResults/**/*.dmp
            TestResults/samples-console.log
          retention-days: 14

      - name: Install ReportGenerator
        if: matrix.os == 'ubuntu-latest'
        run: dotnet tool install --global dotnet-reportgenerator-globaltool

      - name: Generate coverage report
        if: matrix.os == 'ubuntu-latest'
        run: >-
          reportgenerator
          -reports:"TestResults/**/coverage.cobertura.xml"
          -targetdir:"TestResults/CoverageReport"
          -reporttypes:"Html;Cobertura;MarkdownSummaryGithub"

      - name: Upload coverage report
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: TestResults/CoverageReport
          retention-days: 14

      - name: Post coverage summary
        if: matrix.os == 'ubuntu-latest' && github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          path: TestResults/CoverageReport/SummaryGithub.md

  integration:
    name: Integration Tests (Chrome)
    runs-on: ubuntu-latest
    needs: dotnet

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Build
        run: dotnet build Motus.sln --configuration Release

      - name: Test (integration - Chrome)
        timeout-minutes: 10
        run: >-
          dotnet test Motus.sln
          --configuration Release
          --no-build
          --filter "TestCategory=Integration&TestCategory!=Firefox"
          --logger "trx;LogFileName=integration-results.trx"
          --results-directory TestResults

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: TestResults/**/*.trx
          retention-days: 14

      - name: Generate Motus reports
        if: always()
        timeout-minutes: 5
        run: >-
          dotnet run --project src/Motus.Cli/Motus.Cli.csproj --configuration Release --framework net10.0 --no-build --
          run samples/Motus.Samples/bin/Release/net8.0/Motus.Samples.dll
          --reporter console
          --reporter junit:TestResults/motus-junit.xml
          --reporter html:TestResults/motus-report.html
          --reporter trx:TestResults/motus-results.trx

      - name: Upload Motus reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: motus-reports
          path: |
            TestResults/motus-junit.xml
            TestResults/motus-report.html
            TestResults/motus-results.trx
          retention-days: 14

  integration-firefox:
    name: Integration Tests (Firefox)
    runs-on: ubuntu-latest
    needs: dotnet

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install Firefox
        uses: browser-actions/setup-firefox@v1
        with:
          firefox-version: latest

      - name: Build
        run: dotnet build Motus.sln --configuration Release

      - name: Test (integration - Firefox)
        run: >-
          dotnet test Motus.sln
          --configuration Release
          --no-build
          --filter "TestCategory=Integration&TestCategory=Firefox"
          --logger "trx;LogFileName=firefox-integration-results.trx"
          --results-directory TestResults

      - name: Upload Firefox integration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firefox-integration-test-results
          path: TestResults/**/*.trx
          retention-days: 14

